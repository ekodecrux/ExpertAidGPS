apply plugin: 'com.android.application'

android {
    namespace = "com.expertaid.gpstracking"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.expertaid.gpstracking"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Release signing is loaded from android/key.properties or environment variables.
    // If neither is available, release builds use the standard debug keystore so that
    // APK/AAB generation can still be validated. A real Play upload must use a release keystore.
    signingConfigs {
        release {
            def keyPropertiesFile = file('key.properties')
            def keyProperties = new Properties()
            if (keyPropertiesFile.exists()) {
                keyProperties.load(new FileInputStream(keyPropertiesFile))
            }

            def releaseStoreFile = keyProperties.getProperty('storeFile') ?: System.getenv('KEYSTORE_FILE')
            def releaseStorePassword = keyProperties.getProperty('storePassword') ?: System.getenv('KEYSTORE_PASSWORD')
            def releaseKeyAlias = keyProperties.getProperty('keyAlias') ?: System.getenv('KEY_ALIAS')
            def releaseKeyPassword = keyProperties.getProperty('keyPassword') ?: System.getenv('KEY_PASSWORD')

            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStoreFile).exists()) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            } else {
                logger.lifecycle('No complete release keystore configured; using the debug keystore for local build validation only.')
                storeFile = file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
        debug {
            storeFile = file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.firebase:firebase-messaging:23.4.0'
    implementation 'com.google.firebase:firebase-analytics:21.5.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text.trim()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found; Google services plugin not applied")
}

// Keep release builds portable: Firebase configuration is optional for local builds.
if (!file('google-services.json').exists()) {
    logger.lifecycle('google-services.json not found; push notification services will be unavailable in this build.')
}
